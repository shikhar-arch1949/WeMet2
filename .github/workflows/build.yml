name: Build WeMet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: user_repo

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Scaffold Clean Flutter App
        run: |
          set -e
          # 1. Create clean official scaffold
          flutter create --org com.example --project-name wemet app_scaffold
          cd app_scaffold

          # 2. Copy user code
          cp -f ../user_repo/pubspec.yaml .
          rm -rf lib/*
          cp -rf ../user_repo/lib/* ./lib/

          # 3. Add Android permissions to AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_CONTACTS" />\n    <queries>\n        <intent>\n            <action android:name="android.intent.action.DIAL" />\n            <data android:scheme="tel" />\n        </intent>\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="https" />\n        </intent>\n    </queries>' android/app/src/main/AndroidManifest.xml

          # 4. Set compile and target SDK to 34 (required for modern contact plugins)
          find android -name "build.gradle*" -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' {} + || true
          find android -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' {} + || true

          # 5. Fetch dependencies & build APK
          flutter pub get
          flutter build apk --release

          # 6. Prepare download artifact
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/WeMet-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WeMet-Installable-APK
          path: dist/WeMet-v1.0.apk
